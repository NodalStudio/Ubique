    <style>
  /* Benchmark — Nodal Studio layer on top of nodal.css.
     Ubique is drawn in ink, math.js in the Nodal data blue (second series). */
  :root {
    --ubique: #030406;
    --mathjs: #2f5d8a;
    --rule: rgba(3, 4, 6, 0.14);
    --tile: #f5f2dc;
  }
  .bench { counter-reset: sec; }
  .bench section { padding: clamp(48px, 9vh, 112px) 0 0; }
  .section-label {
    counter-increment: sec;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin: 0 0 clamp(24px, 4vh, 40px);
    padding: 0 0 18px;
    border-bottom: var(--stroke) solid var(--ink);
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(34px, 5vw, 80px);
    line-height: 0.92;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }
  .section-label::after {
    content: "§0" counter(sec);
    flex: none;
    padding-left: 48px;
    background: linear-gradient(currentColor, currentColor) left center / 34px 2px no-repeat;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.22em;
  }
  .rule-em { display: none; }

  /* poster hero */
  .bench-hero .ns-wordmark span + span { color: var(--mathjs); }
  .bench-hero .bench-sub { margin: 18px 0 0; font-family: var(--display); font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
  .bench-hero .begin { min-height: 56px; padding: 0 2em; font-size: 13px; }
  .bench-hero .begin[disabled] { opacity: 0.35; pointer-events: none; }

  /* before Begin: only the environment and a prompt */
  body:not(.benchmarks-started) #tests #tests-list,
  body:not(.benchmarks-started) #source,
  body:not(.benchmarks-started) #summary { display: none; }
  body:not(.benchmarks-started) #tests::after {
    content: "Press Begin to populate the figures.";
    display: block;
    font-family: var(--display);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-45);
  }

  /* environment: label column in spaced caps, values in mono */
  #environment table { width: 100%; max-width: 860px; border-collapse: collapse; }
  #environment th, #environment td {
    text-align: left;
    padding: 14px 16px 14px 0;
    border-bottom: var(--stroke) solid var(--ink-08);
    vertical-align: top;
  }
  #environment th {
    width: 16rem;
    font-family: var(--display);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-62);
  }
  #environment td { font-family: var(--mono); font-size: 14px; word-break: break-word; }

  /* figures */
  .figure {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) minmax(360px, 1.4fr);
    gap: 1.5rem 2.5rem;
    padding: clamp(28px, 4vh, 44px) 0;
    border-bottom: var(--stroke) solid var(--ink-08);

  .figure:last-child { border-bottom: none; }
  .figure .fig-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 1.25rem; }
  .figure .fig-num {
    flex: none;
    font-family: var(--display);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-45);

  .figure .fig-title { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.2vw, 29px); letter-spacing: -0.01em; }
  .figure .fig-specimens { grid-column: 1; grid-row: 2; display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
  .figure .fig-trace { grid-column: 2; grid-row: 2; min-height: 180px; }
  .figure .fig-scatter { grid-column: 1; grid-row: 3; min-height: 120px; }
  .figure .fig-speedup { grid-column: 2; grid-row: 3; text-align: right; }

    font-family: var(--display);

  .specimen { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .specimen-label,

    font-family: var(--display);

    <script>
// New code (always runs)
const headerDate = document.getElementById('header-date');
if (headerDate) headerDate.textContent = new Date().toISOString().slice(0, 10);

async function detectEnvironment() {
  const rows = [];
  rows.push(['CPU logical cores', String(navigator.hardwareConcurrency ?? 'unknown')]);
  rows.push(['Device memory (GB)', String(navigator.deviceMemory ?? 'unknown')]);
  rows.push(['Platform', navigator.platform || 'unknown']);
  rows.push(['User agent', navigator.userAgent]);

  let simd = 'no';
  try {
    const bytes = new Uint8Array([
      0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,
      10,10,1,8,0,65,0,253,15,253,98,11
    ]);
    if (await WebAssembly.validate(bytes)) simd = 'yes';
  } catch (_) {}
  rows.push(['WASM SIMD support (kernel uses scalar build)', simd]);
  rows.push(['Libraries', 'Local Ubique bundle; math.js 15.2.0']);
  rows.push(['Input seed', '0x51b1c']);

  let minDelta = Infinity;
  let last = performance.now();
  for (let i = 0; i < 1000; i++) {
    const now = performance.now();
    const d = now - last;
    if (d > 0 && d < minDelta) minDelta = d;
    last = now;
  }
  rows.push(['Timer resolution',
    minDelta === Infinity ? 'unknown' : `${minDelta.toFixed(3)} ms`]);

  const tbody = document.getElementById('env-rows');
  for (const [k, v] of rows) {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = k;
    const td = document.createElement('td');
    td.textContent = v;
    tr.appendChild(th);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}
detectEnvironment().catch(console.error);

// --- Top-level helpers (moved out of IIFE for new scaffold) ---

let dataSeed = 0x51b1c;
function inputRandom() {
  dataSeed = (Math.imul(dataSeed, 1664525) + 1013904223) >>> 0;
  return dataSeed / 4294967296;
}
function generateArray(size) {
  return Array.from({ length: size }, () => inputRandom() * 100);
}

function generateMatrix(rows, cols) {
  return Array.from({ length: rows }, () => generateArray(cols));
}

function generateInvertibleMatrix(n) {
  const matrix = Array(n)
    .fill(0)
    .map(() => Array(n).fill(0));

  for (let i = 0; i < n; i++) {
    let rowSum = 0;
    for (let j = 0; j < n; j++) {
      if (i !== j) {
        matrix[i][j] = inputRandom() * 10;
        rowSum += Math.abs(matrix[i][j]);
      }
    }
    matrix[i][i] = rowSum + inputRandom() * 10 + 10;
  }

  return matrix;
}

function getFunctionArgs(data) {
  if (Array.isArray(data?.args)) {
    return data.args;
  }
  if (data?.matrixA && data?.matrixB) {
    return [data.matrixA, data.matrixB];
  }
  if (data?.matrixA) {
    return [data.matrixA];
  }
  if (data?.data) {
    return [data.data];
  }
  return [];
}

function nextFrame() {
  // requestAnimationFrame is heavily throttled in background tabs; fall back to setTimeout
  // so benchmarks still progress when the tab loses focus.
  if (document.visibilityState === 'hidden') {
    return new Promise((resolve) => setTimeout(resolve, 0));
  }
  return new Promise((resolve) => requestAnimationFrame(resolve));
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Representative public matrix operations; every result must pass correctness.
const tests = [

// --- New matrix drawing helpers (Step 2) ---

const INK = '#030406';
const PAPER_SOFT = '#f5f2dc';

function drawMatrix(canvas, matrix) {
  const rows = matrix.length;
  const cols = matrix[0]?.length || 1;
  if (rows <= 10 && cols <= 10) drawNumberMatrix(canvas, matrix);
  else drawBlueprintDots(canvas, matrix);
}

function drawNumberMatrix(canvas, matrix) {
  const rows = matrix.length, cols = matrix[0].length, cell = 26;
  canvas.width = cols * cell;
  canvas.height = rows * cell;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PAPER_SOFT;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(3, 4, 6, 0.14)';
  ctx.lineWidth = 1;
  ctx.font = '11px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = INK;
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const x = j * cell, y = i * cell;
      ctx.strokeRect(x + 0.5, y + 0.5, cell, cell);
      ctx.fillText(matrix[i][j].toFixed(1), x + cell / 2, y + cell / 2);
    }
  }
}

function drawBlueprintDots(canvas, matrix) {
  const rows = matrix.length, cols = matrix[0].length, D = 140;
  canvas.width = D; canvas.height = D;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PAPER_SOFT;
  ctx.fillRect(0, 0, D, D);

  let min = Infinity, max = -Infinity;
  for (const row of matrix) for (const v of row) {
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const range = max - min || 1;
  const cw = D / cols, ch = D / rows;
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const norm = (matrix[i][j] - min) / range;
      const r = Math.max(0.6, Math.min(cw, ch) * 0.45 * (0.3 + 0.7 * norm));
      ctx.fillStyle = `rgba(3, 4, 6, ${0.15 + 0.7 * norm})`;
      ctx.beginPath();
      ctx.arc(j * cw + cw / 2, i * ch + ch / 2, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Task 4 Step 2: SVG trace renderer ---

const SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

function createTrace(host) {
  host.replaceChildren();

  const svg = svgEl('svg', {
    class: 'trace-svg',
    viewBox: '0 0 600 180',
    preserveAspectRatio: 'none',
  });
  const gridG = svgEl('g', { class: 'grid' });
  for (let i = 1; i < 5; i++) {
    const y = (180 / 5) * i;
    gridG.appendChild(svgEl('line',
      { x1: 0, x2: 600, y1: y, y2: y, class: 'gridline' }));
  }
  svg.appendChild(gridG);

  const pathU = svgEl('path', { class: 'channel-ubique', d: '' });
  const pathM = svgEl('path', { class: 'channel-mathjs', d: '' });
  svg.appendChild(pathU);
  svg.appendChild(pathM);

  const opsLabel = svgEl('text', { class: 'axis-label', x: 4, y: 14 });
  opsLabel.textContent = 'ops/s';
  svg.appendChild(opsLabel);

  const iterLabel = svgEl('text', { class: 'axis-label', x: 596, y: 174, 'text-anchor': 'end' });
  iterLabel.textContent = 'iteration →';
  svg.appendChild(iterLabel);

  host.appendChild(svg);

  const legend = el('div', { class: 'trace-legend' }, [
    el('span', { class: 'leg-ubique', text: 'Ubique' }),
    el('span', { class: 'leg-mathjs', text: 'math.js' }),
  ]);
  host.appendChild(legend);

  const channels = { ubique: { points: [], path: pathU }, mathjs: { points: [], path: pathM } };
  let maxOps = 1;

  // Centered rolling-mean smoothing — averages each point with its
  // neighbours so per-iteration timer jitter doesn't dominate the trace.
  function smooth(pts) {
    const n = pts.length;
    if (n < 5) return pts;
    // Window size: ~7% of the run, clamped to [3, 21], odd.
    let w = Math.max(3, Math.min(21, Math.round(n * 0.07)));
    if (w % 2 === 0) w += 1;
    const half = (w - 1) / 2;
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const lo = Math.max(0, i - half);
      const hi = Math.min(n - 1, i + half);
      let sum = 0;
      for (let j = lo; j <= hi; j++) sum += pts[j];
      out[i] = sum / (hi - lo + 1);
    }
    return out;
  }

  function redraw() {
    const W = 600, H = 180, pad = 6;
    for (const lib of ['ubique', 'mathjs']) {
      const raw = channels[lib].points;
      if (raw.length === 0) { channels[lib].path.setAttribute('d', ''); continue; }
      const pts = smooth(raw);
      const n = pts.length;
      const d = pts.map((ops, i) => {
        const x = (n === 1) ? W / 2 : (i / (n - 1)) * W;
        const y = H - pad - (ops / maxOps) * (H - pad * 2);
        return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      channels[lib].path.setAttribute('d', d);
    }
  }

  // Throttle redraws — rebuilding a 500-segment SVG path on every addPoint
  // is O(n²) and freezes the renderer for fast operations.
  let redrawScheduled = false;
  function scheduleRedraw() {
    if (redrawScheduled) return;
    redrawScheduled = true;
    const cb = () => { redrawScheduled = false; redraw(); };
    if (document.visibilityState === 'hidden') setTimeout(cb, 16);
    else requestAnimationFrame(cb);
  }

  return {
    addPoint(lib, ops) {
      channels[lib].points.push(ops);
      if (ops > maxOps) maxOps = ops;
      scheduleRedraw();
    },
    reset() {
      channels.ubique.points = [];
      channels.mathjs.points = [];
      maxOps = 1;
      redraw();
    },
    flush() {
      redrawScheduled = false;
      redraw();
    },
  };
}

// --- Task 4 Step 3: Benchmark timing primitives ---

function summarizeTimes(times) {
  const n = times.length;
  const mean = times.reduce((a, b) => a + b, 0) / n;
  const variance = times.reduce((a, t) => a + (t - mean) ** 2, 0) / Math.max(1, n - 1);
  const sigma = Math.sqrt(variance);
  return { n, mean, sigma };
}

function renderScatter(fig, ubiqueTimes, mathjsTimes) {
  const host = fig.querySelector('[data-role="scatter"]');
  host.replaceChildren();
  if (ubiqueTimes.length === 0 || mathjsTimes.length === 0) return;

  const W = 600, H = 120, padL = 60, padR = 12, padY = 22;
  const innerW = W - padL - padR;
  const laneH = (H - padY * 2) / 2;
  const all = [...ubiqueTimes, ...mathjsTimes];
  const max = Math.max(...all);
  const xFor = (t) => padL + (t / (max || 1)) * innerW;
  const laneY = (idx) => padY + laneH / 2 + idx * laneH;

  const svg = svgEl('svg', {
    class: 'scatter-svg', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none',
  });

  function lane(label, times, klass, idx) {
    const mean = times.reduce((a, b) => a + b, 0) / times.length;
    const sigma = Math.sqrt(
      times.reduce((a, t) => a + (t - mean) ** 2, 0) / Math.max(1, times.length - 1)
    );
    const y = laneY(idx);
    const xMean = xFor(mean);
    const xLo = xFor(Math.max(0, mean - sigma));
    const xHi = xFor(Math.min(max, mean + sigma));

    const labelEl = svgEl('text', {
      class: 'lane-label', x: padL - 8, y: y + 3, 'text-anchor': 'end',
    });
    labelEl.textContent = label;
    svg.appendChild(labelEl);

    svg.appendChild(svgEl('rect', {
      class: `sigma-band sigma-${klass}`,
      x: xLo, y: y - laneH * 0.4,
      width: Math.max(1, xHi - xLo), height: laneH * 0.8,
    }));

    for (const t of times) {
      const jitter = (Math.random() - 0.5) * (laneH * 0.5);
      svg.appendChild(svgEl('circle', {
        class: `pt-${klass}`, cx: xFor(t).toFixed(1),
        cy: (y + jitter).toFixed(1), r: 2,
      }));
    }

    svg.appendChild(svgEl('line', {
      class: `mean-line mean-${klass}`,
      x1: xMean, x2: xMean,
      y1: y - laneH * 0.45, y2: y + laneH * 0.45,
    }));
  }

  lane('UBIQUE',  ubiqueTimes, 'ubique', 0);
  lane('MATH.JS', mathjsTimes, 'mathjs', 1);

  const axis = svgEl('text', { class: 'lane-label', x: W - padR, y: H - 6, 'text-anchor': 'end' });
  axis.textContent = 'batch mean ms/op →';
  svg.appendChild(axis);

  host.appendChild(svg);

async function runOneTest(test, fig, _index) {
  const trace = createTrace(fig.querySelector('[data-role="trace"]'));
  trace.reset();
  fig.scrollIntoView({ behavior: 'smooth', block: 'center' });

  const data = test.setup();
  renderSpecimens(fig, data, test.name);

  const args = getFunctionArgs(data);
  const protocol = window.benchmarkProtocol;
  if (!protocol.resultsAgree(test.rubique(...args), test.mathjs(...args))) {
    fig.querySelector('.speedup-value').textContent = 'Mismatch';
    fig.querySelector('.speedup-label').textContent = 'Correctness failed; timing suppressed';
    return;
  }
  // Warm both on identical inputs. A calibrated batch reduces timer quantization.
  for (let i = 0; i < 10; i++) { test.rubique(...args); test.mathjs(...args); }
  const iterations = protocol.calibrateIterations([() => test.rubique(...args), () => test.mathjs(...args)]);
  const uTimes = [], mTimes = [];
  for (let batch = 0; batch < 9; batch++) {
    const runU = () => uTimes.push(protocol.timeBatch(() => test.rubique(...args), iterations));
    const runM = () => mTimes.push(protocol.timeBatch(() => test.mathjs(...args), iterations));
    if (batch % 2 === 0) { runU(); runM(); } else { runM(); runU(); }
    if (uTimes[batch] > 0) trace.addPoint('ubique', 1000 / uTimes[batch]);
    if (mTimes[batch] > 0) trace.addPoint('mathjs', 1000 / mTimes[batch]);
    await nextFrame();
  }
  const u = summarizeTimes(uTimes), m = summarizeTimes(mTimes);
  const uMedian = protocol.medianTime(uTimes), mMedian = protocol.medianTime(mTimes);
  if (!protocol.timingUsable(uTimes, iterations) || !protocol.timingUsable(mTimes, iterations)) {
    unresolvedResults.push({name:test.name, correctness:'passed', timing:'unresolved', ubiqueSamples:uTimes, mathjsSamples:mTimes, iterationsPerBatch:iterations});
    fig.querySelector('.speedup-value').textContent = 'Unresolved';
    fig.querySelector('.speedup-label').textContent = 'Below timer resolution; no speed ratio';
    fig.querySelector('.speedup-stats').textContent = `Output agrees; timing does not meet the 1 ms minimum batch duration. ${iterations} ops/batch. Excluded from summary.`;
    return;
  }
  const speedup = mMedian / uMedian;

  const speedupHost = fig.querySelector('[data-role="speedup"]');
  const valEl   = speedupHost.querySelector('.speedup-value');
  const labEl   = speedupHost.querySelector('.speedup-label');
  const statsEl = speedupHost.querySelector('.speedup-stats');
  if (speedup >= 1) {
    valEl.textContent = `${speedup.toFixed(1)}×`;
    labEl.textContent = 'faster';
  } else {
    valEl.textContent = `${(1 / speedup).toFixed(1)}×`;
    labEl.textContent = 'slower';
  }
  statsEl.textContent = `9 alternating batches × ${iterations} ops/batch; median ${protocol.formatDuration(uMedian)}/op; output agrees · timing resolved`;
  speedupHost.classList.remove('stamped');
  void speedupHost.offsetWidth;
  speedupHost.classList.add('stamped');

  trace.flush();
  renderScatter(fig, uTimes, mTimes);

  allResults.push({
    name: test.name,
    rubiqueMean: uMedian, rubiqueSigma: u.sigma,
    mathjsMean: mMedian, mathjsSigma: m.sigma,
    ubiqueSamples: uTimes, mathjsSamples: mTimes, iterationsPerBatch: iterations,
    speedup, n: u.n,
  });

  await sleep(400);
}

  item.className = 'source-item';
  const summary = document.createElement('summary');
  summary.textContent = `Fig. ${i + 1} · ${test.name}`;
  item.appendChild(summary);
  const body = el('div', { class: 'source-body' }, [
    sourceColumn('Ubique', uSrc),
    sourceColumn('math.js', mSrc),
  ]);
  item.appendChild(body);
  sourceList.appendChild(item);
});

const summarySection = document.getElementById('summary');
summarySection.replaceChildren(
  el('div', { class: 'section-label', text: 'Summary' }),
);

function statBlock(bigId, labelText) {
  return el('div', { class: 'summary-stat' }, [
    el('div', { class: 'big', id: bigId, text: '—' }),
    el('div', { class: 'label', text: labelText }),
  ]);
}

const statsCol = el('div', { class: 'summary-stats' }, [
  statBlock('sum-mean', 'Geometric mean ratio'),
  statBlock('sum-won',  'Tests where Ubique was faster'),
  statBlock('sum-best', 'Best result'),
]);

const canvasEl = document.createElement('canvas');
canvasEl.id = 'summary-chart';
const chartWrap = el('div', { class: 'summary-chart-wrap' }, [canvasEl]);

summarySection.appendChild(el('div', { class: 'summary-grid' }, [statsCol, chartWrap]));

const foot = el('p', { class: 'summary-foot' });
foot.append(
  'Browser ',
  Object.assign(document.createElement('code'), { textContent: 'performance.now()' }),
  ' precision is capped (typically 5 µs–1 ms depending on isolation context). JS is single-threaded; results vary with hardware, browser, and ambient load. Results use identical seeded inputs, a finite-result correctness gate (absolute 1e-10 + relative 1e-9), 10 warmups, and medians of 9 alternating batches. Ubique is bundled from this checkout; math.js is pinned to 15.2.0. Setup and module loading are excluded; JS/WASM packing is included. These are local measurements, not universal speed claims.',
);
summarySection.appendChild(foot);
const exportButton = el('button', { class: 'replay', text: 'Export raw results' });
exportButton.addEventListener('click', () => {
  const report = {
    metadata: { ...window.benchmarkBuild, timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent, seed: '0x51b1c', precision: 'f64',
      protocol: '10 warmups; repeated-probe calibration targets >=10ms for faster batch; 9 alternating batches; minimum accepted batch 1ms; median ms/op; nested API including copies',
      tolerance: { absolute: 1e-10, relative: 1e-9 } },
    results: allResults,
    unresolvedResults,
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
  const link = document.createElement('a'); link.href = url; link.download = 'ubique-benchmark.json';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
summarySection.appendChild(exportButton);


const replay = el('button', { class: 'replay', id: 'replay-btn', text: '↻ Repeat experiment' });
replay.addEventListener('click', () => location.reload());
summarySection.appendChild(replay);

const testsList = document.getElementById('tests-list');
tests.forEach((test, i) => {
  const fig = buildFigure(test, i + 1);
  testsList.appendChild(fig);
  renderSpecimens(fig, test.setup(), test.name);
});

const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) {
      e.target.classList.add('in-view');
      io.unobserve(e.target);
    }
  }
}, { threshold: 0.15 });
document.querySelectorAll('.figure').forEach(f => io.observe(f));
