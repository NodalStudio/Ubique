# Deno 2.9.7 decodes OIDC JWTs with standard Base64, not Base64URL.
# Unicode workflow names can inject '-' into the payload and fail after upload.
name: Publish to JSR and npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      provenance_check_only:
        description: Verify real OIDC decoding without publishing a package
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test provenance regression
        run: deno test test/provenance_test.ts
      - name: Check actual GitHub OIDC payload before uploading anything
        run: deno run --allow-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN --allow-net scripts/check_jsr_provenance.ts

  publish:
    needs: provenance
    if: ${{ !inputs.provenance_check_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@12.2.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Build WASM
        run: deno task build

      - name: Run tests
        run: deno task test

      - name: Run linter
        run: deno task lint

      - name: Setup Python for independent numerical references
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check numerical results against SciPy and mpmath
        run: |
          python -m pip install -r scripts/reference-requirements.txt
          python scripts/test_reference.py

      - name: Extract version from tag
        id: get_version
        run: |
          version=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "Release tag does not match deno.json" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build npm package
        run: deno task build:npm ${{ steps.get_version.outputs.VERSION }}

      - name: Test npm package
        run: deno task test:npm

      - name: Check npm builds against independent references
        run: |
          python scripts/test_reference.py --runtime node --module "file://$PWD/npm/esm/index.js"
          python scripts/test_reference.py --runtime node --module "file://$PWD/npm/script/index.js"

      - name: Publish to JSR
        run: deno publish --allow-dirty

      - name: Publish to npm
        run: |
          cd npm
          npm publish
