name: 📝 Deploy Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build documentation
        run: deno task docs

      - name: Use the Chrome already installed on the GitHub runner
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "PLAYWRIGHT_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Check documentation layouts and runnable examples
        run: |
          python3 -m http.server 8873 --bind 127.0.0.1 --directory docs > /tmp/ubique-docs-server.log 2>&1 &
          deno run -A scripts/test_docs_browser.mjs
          deno task test:browser

      - name: Create .nojekyll
        run: touch docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
